[project]
name = "gateway"
version = "0.1.0"
description = "Basic LLM gateway: input guardrails, then forwards to a single configured model."
authors = [
    { name = "sarthak77", email = "sarthak02singhal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.75",
    "grpcio-reflection>=1.83.1",
    "protobuf>=6.32",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.75",
    "pytest>=8",
]

[project.scripts]
gateway = "gateway.main:run"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
