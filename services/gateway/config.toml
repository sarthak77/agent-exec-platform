[grpc]
host = "0.0.0.0"
port = 50054

[model]
# OpenCode Zen free public tier via the Responses API (ZenProvider). The key
# defaults to "public" (no env var needed); base_url defaults to the Zen
# endpoint for provider "opencode". This model supports tool calling, so the
# full tool-calling pipeline runs on this path. `max_tokens` is intentionally
# not forwarded to Zen (its reasoning models spend the output budget on hidden
# reasoning, so a small cap would truncate tool calls); per-call temperature
# from the caller (e.g. the agent's llm_config) overrides the default below.
provider = "opencode"
name = "muse-spark-1.3-contributor-free"
max_tokens = 512
temperature = 0.7
# Free-tier Zen calls are occasionally slow; keep this under the orchestrator's
# [gateway] timeout so a slow call returns a typed error here rather than
# tripping the caller's RPC deadline.
timeout_seconds = 60

[guardrails]
max_input_chars = 8000
blocklist = [
    "ignore previous instructions",
    "ignore all previous instructions",
    "disregard previous instructions",
    "reveal your system prompt",
    "jailbreak",
]
