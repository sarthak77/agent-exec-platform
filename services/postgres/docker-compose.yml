services:
  postgres:
    image: postgres:16-alpine
    container_name: aep-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aep} -d ${POSTGRES_DB:-aep}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aep_postgres_data:
