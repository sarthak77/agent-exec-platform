syntax = "proto3";

package aep.orchestrator.v1;

// Coordinates one turn across a tenant's configured agents (AutoGen group
// chat) plus the mcp_svc tool catalog. Shape mirrors gateway's own
// ChatRequest/ChatResponse convention (in turn mirroring llm-model-service's
// ChatRequest/ChatResponse), minus per-request model overrides and tool
// calling — each agent already carries its own LLMConfig in the DB, and
// mcp_svc has no execution binding yet.
service OrchestratorService {
  rpc Chat(ChatRequest) returns (ChatResponse);
}

message ChatRequest {
  repeated Message messages = 1;
}

message Message {
  string role = 1;     // "user" | "assistant" | "system"
  string content = 2;
  string agent = 3;     // name of the agent that produced this message; empty for input messages
}

message ChatResponse {
  repeated Message messages = 1;   // full transcript produced by the group chat this turn
  TokenUsage token_usage = 2;      // summed across every participant's gateway calls
  string finish_reason = 3;
}

message TokenUsage {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
}
