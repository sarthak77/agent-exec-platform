syntax = "proto3";

package aep.job.v1;

import "google/protobuf/timestamp.proto";

service JobService {
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
}

message CreateJobRequest {
  JobType type = 1;
  JobSpec spec = 2;
  optional int32 max_attempts = 3;
  // User/manual retry budget: how many times a caller may RetryJob a job that
  // has exhausted its automatic retry budget (max_attempts) and rests at
  // `failed`, before it is dead-lettered. Distinct from max_attempts, which is
  // consumed automatically by the runner without any caller involvement.
  optional int32 max_retries = 4;
}

message CreateJobResponse {
  Job job = 1;
}

message GetJobRequest {
  GetJobRequestFilter filter = 1;
}

message GetJobRequestFilter {
  repeated string ids = 1;
  repeated JobStatus statuses = 2;
  repeated JobType types = 3;
}

message GetJobResponse {
  repeated Job jobs = 1;
}

message UpdateJobRequest {
  string id = 1;
  JobStatus status = 2;
}

message UpdateJobResponse {
  Job job = 1;
}

message RetryJobRequest {
  string id = 1;
}

message RetryJobResponse {
  Job job = 1;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_DEAD = 5; // retries exhausted
  JOB_STATUS_CANCELLED = 6;
  // Paused mid-run awaiting a human approval (e.g. a tool that sends email
  // refused to send until approved). The poller/reaper ignore this status, so
  // the job waits indefinitely; an approving caller transitions it back to
  // queued (see the runner's approval handling) and the poller resumes it from
  // its progress checkpoint.
  JOB_STATUS_WAITING_APPROVAL = 7;
}

message Job {
  string id = 1;
  JobType type = 2;
  JobSpec spec = 3;
  JobStatus status = 4;
  int32 attempts = 5;
  int32 max_attempts = 6;
  JobMetadata metadata = 9;
  JobProgress progress = 10; // runner execution checkpoint (resume/idempotency)
  // How many times a caller has retried this job via RetryJob, and the budget
  // of such retries before it is dead-lettered. Distinct from attempts/
  // max_attempts, which track the automatic (no-caller-involved) retry cycle.
  int32 retry_count = 11;
  int32 max_retries = 12;
  JobResult result = 13; // final result, keyed by JobType (mirrors JobSpec)
}

// Execution checkpoint the runner maintains: the prompt decomposition plan and
// the outputs of each completed step. Persisted across retries so a re-run
// resumes from the last successful step. Empty until the runner has planned.
message JobProgress {
  JobPhase phase = 1;          // where the runner is in the plan
  repeated string plan = 2;    // ordered sub-prompts the job was decomposed into
  repeated JobStep steps = 3;  // completed steps, in execution order
  string error = 4;            // message from the most recent failed attempt, if any
  string result = 5;           // final answer once phase is JOB_PHASE_COMPLETED
}

// The runner's progress through a job's plan.
enum JobPhase {
  JOB_PHASE_UNSPECIFIED = 0;  // not started -- no plan computed yet
  JOB_PHASE_PLANNING = 1;     // decomposing the prompt into a plan
  JOB_PHASE_EXECUTING = 2;    // plan computed; running its steps in order
  JOB_PHASE_COMPLETED = 3;    // every step finished
}

message JobStep {
  int32 index = 1;              // position in `plan`
  string prompt = 2;            // the sub-prompt that was executed
  string output = 3;            // the orchestrator's answer for this step
  FinishReason finish_reason = 4;
  string agent = 5;              // name of the group-chat agent that produced `output`
}

// Why the orchestrator ended a step's turn (mirrors the reasons it emits).
enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;               // the turn completed normally
  FINISH_REASON_REQUIRES_APPROVAL = 2;  // a tool paused on a human-approval gate
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_AGENT_EXECUTION = 1;
}

message JobSpec {
  oneof spec {
    AgentExecutionSpec agent_execution_spec = 1;
  }
}

message AgentExecutionSpec {
  string name = 1;
  string instructions = 2;
  LLMConfig llm_config = 3;
  ToolConfig tool_config = 4;
}

message JobResult {
  oneof result {
    AgentExecutionResult agent_execution_result = 1;
  }
}

message AgentExecutionResult {
  string output = 1; // the agent's final answer
}

message LLMConfig {
  string name = 1;
  float temperature = 2;
}

message ToolConfig {
  repeated string ids = 1;
}

message JobMetadata {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
}
