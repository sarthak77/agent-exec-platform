[project]
name = "mcp-svc"
version = "0.1.0"
description = "MCP server exposing the tool catalog (queried live from Postgres) to MCP clients."
authors = [
    { name = "sarthak77", email = "sarthak02singhal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2,<3",
    "uvicorn>=0.31",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[project.scripts]
mcp-svc = "mcp_svc.main:run"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
